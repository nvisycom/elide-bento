[project]
name = "elide-bento-stt"
version = "0.1.0"
description = "Default speech-to-text inference service for elide (WhisperX)"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "Nvisy" }]
dependencies = [
    # PYSEC-2026-3545/3546/3547.
    "aiohttp>=3.14.3,<4",
    "bentoml>=1.4.39,<2",
    "elide-bento-core",
    # Audio decoding: librosa reads whatever the image's ffmpeg understands.
    "librosa>=0.11,<1",
    "prometheus-client>=0.26.0",
    # WhisperX: faster-whisper ASR + wav2vec2 alignment + pyannote diarization.
    # NOTE: currently unsatisfiable in this workspace — whisperx pins
    # huggingface-hub<1.0.0 while elide-bento-ner needs transformers>=5.15.0
    # (-> huggingface-hub>=1.5.0). See README. Left commented so the workspace
    # resolves; uncomment once the conflict is resolved.
    # "whisperx>=3.8,<4",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
